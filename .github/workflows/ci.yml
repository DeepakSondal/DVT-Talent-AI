name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests & Security
    runs-on: ubuntu-latest
    env:
      TESTING: "true"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      DATABASE_SYNC_URL: "sqlite:///:memory:"
      SECRET_KEY: "ci-secret-key-for-testing-purposes-only-32bytes"
      JWT_SECRET: "ci-jwt-secret-key-for-testing-purposes-only-32bytes"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -r backend/requirements.txt
          uv pip install --system -r backend/requirements-optional.txt
          uv pip install --system ruff pip-audit

      - name: Run Ruff Lint
        run: ruff check backend

      - name: Run Pytest
        run: |
          cd backend
          pytest tests -v

      - name: Run Pip Audit (Vulnerability Check)
        run: pip-audit -r backend/requirements.txt --ignore-vuln GHSA-3qf3-8w2g-rqmx || true

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci --legacy-peer-deps

      - name: Run ESLint
        run: npm --prefix frontend run lint

      - name: Run TypeScript Type-Check
        run: npm --prefix frontend run type-check

      - name: Run Next.js Build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000/api/v1/ws"
        run: npm --prefix frontend run build
