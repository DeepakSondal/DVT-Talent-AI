[project]
name = "dvt-talent-ai-backend"
version = "1.0.0"
description = "Enterprise AI recruitment platform backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.34.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.28.1",
    "openai>=1.60.0",
    "pydantic-ai==1.107.7",
    "logfire[fastapi]>=5.4.0",
    "mcp>=2.3.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==3.2.2",
    "python-multipart>=0.0.32",
    "authlib>=1.9.1",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.2.4",
    "beautifulsoup4>=4.12.3",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "slowapi>=0.1.9",
    "jinja2>=3.1.6",
    "aiofiles>=23.2.1",
    "websockets>=14.0",
    "python-docx>=1.1.0",
    "pypdf>=6.21.4",
    "python-dateutil>=2.9.0",
    "sentry-sdk[fastapi]>=2.20.0",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "aiosqlite>=0.20.0",
    "filelock>=4.2.4",
    "pip-audit>=2.8.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B"]
ignore = ["E501"]

