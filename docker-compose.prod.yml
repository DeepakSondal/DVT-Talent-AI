# ------------------------------------------------------------------
# Production stack. Secrets and settings live in ./.env-production.
#
# ALWAYS invoke with --env-file so that ${VAR} interpolation below
# (DB_PASSWORD, SECRET_KEY, GROQ_API_KEY, NEXT_PUBLIC_API_URL, ...)
# resolves from .env-production. Without it, those entries resolve to
# empty strings and OVERRIDE the values loaded via env_file.
#
#   docker compose --env-file .env-production -f docker-compose.prod.yml up -d --build
# ------------------------------------------------------------------
services:
  caddy:
    image: caddy:2.7-alpine
    container_name: dvt_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dvt_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://dvttalent.com/api/v1}
    container_name: dvt_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://dvttalent.com/api/v1}
    networks:
      - dvt_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: dvt_api
    env_file: ./.env-production
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://dvt_user:${DB_PASSWORD}@db:5432/dvt_talent
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - APP_BASE_URL=${APP_BASE_URL:-https://dvttalent.com}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://dvttalent.com}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-Deepak@dvttalent.com}
      - SECRET_KEY=${SECRET_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    networks:
      - dvt_network
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - dvt_storage:/app/storage
      - dvt_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: dvt_worker
    env_file: ./.env-production
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://dvt_user:${DB_PASSWORD}@db:5432/dvt_talent
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-Deepak@dvttalent.com}
      - SECRET_KEY=${SECRET_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    networks:
      - dvt_network
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - dvt_storage:/app/storage
      - dvt_uploads:/app/uploads

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: scheduler
    container_name: dvt_scheduler
    env_file: ./.env-production
    command: celery -A workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler -s /app/storage/celerybeat-schedule
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://dvt_user:${DB_PASSWORD}@db:5432/dvt_talent
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-Deepak@dvttalent.com}
      - SECRET_KEY=${SECRET_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    networks:
      - dvt_network
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - dvt_storage:/app/storage

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: dvt_chromadb
    restart: always
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - dvt_network

  redis:
    image: redis:7-alpine
    container_name: dvt_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dvt_network

  db:
    image: postgres:16-alpine
    container_name: dvt_db
    restart: always
    environment:
      - POSTGRES_USER=dvt_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=dvt_talent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvt_user -d dvt_talent"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - dvt_network

networks:
  dvt_network:
    driver: bridge

volumes:
  postgres_prod_data:
  chroma_data:
  caddy_data:
  caddy_config:
  dvt_storage:
  dvt_uploads:
